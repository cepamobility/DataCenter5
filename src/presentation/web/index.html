<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interaction Cam</title>
<link rel="stylesheet" href="interactioncam.css">
</head>
<body>
  <header>
    <script type="text/javascript" src="menu/scripts/jquery-2.0.2.min.js"></script>
  </header>
  <div id="videocontainer">
	  <video id="video" controls muted></video>
	  
  </div>
  <canvas id="canvas"></canvas>
  <div id="audiocontainer">
	<video id="audio" controls></video>
  </div>	
  <div id="foto"></div>
  <input type="button" value="foto" onclick="takepicture();"/>
  <input type="button" value="subir" onclick="upload();"/>
  <input type="button" value="Grabar Audio" onclick="recordAudio();"/>
  <input type="button" value="Parar Audio" onclick="stopAudio();"/>
  <input type="button" id="a" value="Cargar Audio" onclick="cAudio();"/>
  <input type="button" value="subir" onclick="upload();"/>
  
  <script type="text/javascript">
  $(document).ready(
		  function(){
			 $('#a').hide(); 
  		video        = document.querySelector('#video');
   		canvas       = document.querySelector('#canvas');
   
	 	ctx    = canvas.getContext('2d');
	  streaming    = false;
	  width  = 600;
	  height = 450;
	  strAudio=null;
	  
	  img = new Image(),
      imgwidth = 150,
      imgheight = 150;
  	  img.src = 'menu/images/main_logo_large.png';
		init();
	});
  
 	 function init() {
 		
 	      
	    navigator.getMedia = ( navigator.getUserMedia ||
	                           navigator.webkitGetUserMedia ||
	                           navigator.mozGetUserMedia ||
	                           navigator.msGetUserMedia);

	    navigator.getMedia(
	      {
	        video: true,
	        audio: true
	      },
	      function(stream) {
	    	  strAudio=stream;
	        if (navigator.mozGetUserMedia) {
	          video.mozSrcObject = stream;
	        } else {
	          var vendorURL = window.URL || window.webkitURL;
	          video.src = vendorURL ? vendorURL.createObjectURL(stream) : stream;
	        }
	        video.play();
	        video.style.width = width + 'px';
	        video.style.height = height + 'px';
	      },
	      function(err) {
	        console.log("An error occured! " + err);
	      }
	    );

	    video.addEventListener('play', function(ev){
	       if (!streaming) {
	          console.log(video.clientHeight);
	          finalheight = video.clientHeight / (video.clientWidth/width);
	          video.setAttribute('width', width);
	          video.setAttribute('height', finalheight);
	          canvas.width = width;
	          canvas.height = finalheight;
	          ctx.drawImage(img, 590 - imgwidth, 440 - imgheight, imgwidth, imgheight);
	          streaming = true;
	          
	        }
	      }, false);
	  }

 	var streamRecorder;
 	var blob;
 	 function recordAudio(){
 		 $('#a').hide();
 		streamRecorder = new MediaRecorder(strAudio);
 		streamRecorder.ondataavailable = dataavailable;
 		 
	   try { 
		   streamRecorder.start(2000); //every 1000ms, trigger dataavailable event
	   } catch (e) {
	     //handle start fail exception
	   }
 	}	
		function finish(){
			 $('#a').show();
			}
 	 function stopAudio() {
		    streamRecorder.stop();
     }

 	

 	function dataavailable(e) {
 	   //combine the blob data and write to disk
 	   blob = new Blob([e.data], {type: 'audio/ogg'});
 	   var vendorURL = window.URL || window.webkitURL;
 	   audioDataURL = vendorURL ? vendorURL.createObjectURL(e.data) : e.data;
		
 	 }
	 
 	 
 	 
 	 function takepicture() {
 	    ctx.save();
 	    ctx.translate(width, 0);
 	    ctx.scale(-1, 1);
 	    ctx.drawImage(video, 0, 0, width, finalheight);
 	    ctx.restore();
 	    ctx.scale(1, 1);
 	    ctx.drawImage(img, 590 - imgwidth, 440 - imgheight, imgwidth, imgheight);
 	    $('#foto').append(img);
 	  }

 	 function cAudio(){
 		 var vendorURL = window.URL || window.webkitURL;
 		audio.src = audioDataURL;
 	 	 }
 	function upload() {
 	    var head = /^data:image\/(png|jpeg);base64,/,
 	        data = '',
 	        fd = new FormData(),
 	        xhr = new XMLHttpRequest();

 	    data = canvas.toDataURL('image/jpeg', 0.9).replace(head, '');

 	    fd.append('audio', blob);
	 	
 	   	
 	    if (location.hostname.indexOf('localhost')!== -1) {
 	      fd.append('contents', data);
 	      xhr.open('POST', 'Copy.do');
 	      xhr.addEventListener('error', function(ev) {
 	        console.log('Upload Error!');
 	      }, false);
 	      xhr.addEventListener('load', function(ev) {
 	    	 alert('Subida');
	         	document.location.href='index2.jsp';
 	      }, false);
 	      xhr.send(fd);
 	    } else {
 	      fd.append('contents', data);
 	      xhr.open('POST', 'Copy.do');
 	      xhr.addEventListener('error', function(ev) {
 	        console.log('Upload Error!');
 	      }, false);
 	      xhr.addEventListener('load', function(ev) {
 	        try {
 	         	alert('Subida');
 	         	document.location.href='index2.jsp';
 	        } catch(e) {
 	          console.log('Upload Error!' + e);
 	        }
 	      }, false);
 	      xhr.send(fd);
 	    }
 	  }
	  	
  </script> 
</body>
</html>
